<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад - Загрузка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @keyframes flashGreen { 0% { background-color: #22c55e; } 100% { background-color: transparent; } }
        @keyframes flashRed { 0% { background-color: #ef4444; } 100% { background-color: transparent; } }
        .flash-green { animation: flashGreen 1s ease-out; }
        .flash-red { animation: flashRed 2s ease-out; }
        
        #error-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(239, 68, 68, 0.95); z-index: 50; justify-content: center; align-items: center; flex-direction: column; color: white; }
        
        #sound-unlock-overlay { display: none; position: absolute; inset: 0; background-color: rgba(30, 58, 138, 0.95); z-index: 40; justify-content: center; align-items: center; flex-direction: column; color: white; }

        @media print {
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block !important; position: static; width: 100%; color: black; padding: 20px; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: left; }
            .print-table th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            .signature-block { margin-top: 50px; display: flex; justify-content: space-between; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- Экран входа -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-gray-100 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">Вход в систему</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" class="w-full border rounded p-2" placeholder="email@sklad.ru">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Пароль</label>
                <input type="password" id="password" class="w-full border rounded p-2" placeholder="******">
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Войти</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>
    </div>

    <!-- Верхняя панель -->
    <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center no-print shrink-0">
        <div>
            <h1 class="text-xl font-bold">Склад - Загрузка</h1>
            <p id="user-info" class="text-sm text-blue-200"></p>
        </div>
        <button onclick="logout()" class="text-sm bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded">Выйти</button>
    </header>

    <!-- Главный экран -->
    <div id="dashboard-screen" class="flex-1 overflow-auto p-4 hidden no-print">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <h2 class="text-2xl font-bold">Автомобили на загрузку</h2>
            <button onclick="showCreateForm()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow w-full sm:w-auto">
                + Создать ведомость
            </button>
        </div>
        <div id="manifests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- Форма создания -->
    <div id="create-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center no-print p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md md:max-w-xl">
            <h3 class="text-xl font-bold mb-4">Новая ведомость</h3>
            <input type="text" id="new-car-number" placeholder="Номер авто (АА 1234 ВВ)" class="w-full border rounded p-2 mb-4 font-bold text-lg">
            
            <label class="block text-sm font-medium mb-1">Скопируйте таблицу из Excel и вставьте сюда:</label>
            <textarea id="new-manifests-list" rows="6" oninput="updateManifestCount()" placeholder="Вставьте скопированные данные..." class="w-full border rounded p-2 mb-1 font-mono text-xs whitespace-pre"></textarea>
            
            <div id="manifest-counter" class="text-green-600 font-bold mb-4 h-6">Распознано: 0 манифестов (0 палет)</div>

            <div class="flex justify-end gap-2">
                <button onclick="hideCreateForm()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 font-bold">Отмена</button>
                <button onclick="saveManifest()" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-bold">Создать</button>
            </div>
        </div>
    </div>

    <!-- Экран сканирования -->
    <div id="scan-screen" class="hidden flex-1 flex flex-col no-print bg-white overflow-hidden relative">
        
        <!-- ЭКРАН РАЗБЛОКИРОВКИ ЗВУКА -->
        <div id="sound-unlock-overlay" class="flex">
            <h2 class="text-3xl font-bold mb-8 text-center px-4">Режим сканирования</h2>
            <button onclick="unlockAudio()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-6 px-12 rounded-full text-2xl shadow-2xl animate-pulse">
                ВКЛЮЧИТЬ ЗВУК И НАЧАТЬ
            </button>
            <p class="mt-6 text-blue-200 text-center px-4">Внимание: Убедитесь, что на телефоне НЕ включен беззвучный режим!</p>
        </div>

        <div class="bg-gray-200 p-4 flex justify-between items-center border-b shrink-0">
            <div>
                <button onclick="closeScanner()" class="bg-gray-400 hover:bg-gray-500 text-white px-3 py-2 rounded font-bold mr-2 text-sm">← Назад</button>
                <span class="text-lg md:text-xl font-bold" id="scan-car-number">АВТОМОБИЛЬ</span>
            </div>
            <div class="flex gap-2 items-center">
                <div class="text-right mr-2">
                    <div class="text-xl md:text-2xl font-bold text-blue-600"><span id="scan-count">0</span> / <span id="scan-total">0</span></div>
                    <div class="text-xs text-gray-500">мест (палет)</div>
                </div>
                <button onclick="generatePDF()" class="bg-blue-600 text-white px-3 py-2 rounded font-bold text-sm">Акт</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- Левая часть: Сканер -->
            <div id="scan-flash-area" class="flex-1 p-4 md:p-6 flex flex-col items-center justify-center transition-colors border-b md:border-b-0 md:border-r overflow-y-auto">
                <input type="text" id="scanner-input" autocomplete="off" class="w-full max-w-2xl text-center text-2xl md:text-4xl font-mono border-4 border-blue-400 rounded-lg p-4 md:p-6 shadow-inner focus:outline-none focus:border-blue-600 focus:bg-blue-50" placeholder="Сканируйте штрих-код...">
                <button onclick="document.getElementById('scanner-input').focus()" class="mt-4 text-sm text-blue-500 underline">Вернуть фокус сканеру</button>
                
                <div id="scan-last-result" class="mt-6 text-center h-24"></div>
            </div>

            <!-- Правая часть: Список -->
            <div class="w-full md:w-1/3 lg:w-1/4 bg-gray-50 flex flex-col shrink-0 h-1/2 md:h-full">
                <div class="bg-gray-200 p-2 text-center font-bold text-sm text-gray-700 shadow-sm z-10">
                    План загрузки (документы)
                </div>
                <div class="flex-1 overflow-y-auto p-2">
                    <ul id="manifest-items-list" class="space-y-2">
                        <!-- Список -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Красная шторка ошибки -->
    <div id="error-overlay">
        <h1 class="text-4xl md:text-6xl font-bold mb-4">ОШИБКА!</h1>
        <p class="text-xl md:text-2xl mb-8 text-center px-4" id="error-message">Неправильный номер</p>
        <button onclick="closeErrorOverlay()" class="bg-white text-red-600 font-bold py-4 px-12 rounded-full text-xl md:text-2xl hover:bg-gray-100">ЗАКРЫТЬ</button>
    </div>

    <div id="print-area" class="hidden bg-white"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBUp11R-Sq46IrW9lwH5uFjXXzli5OASsU",
          authDomain: "sklad-app-b04e3.firebaseapp.com",
          projectId: "sklad-app-b04e3",
          storageBucket: "sklad-app-b04e3.firebasestorage.app",
          messagingSenderId: "433669721018",
          appId: "1:433669721018:web:ec68089819da1d5f952b83"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let unsubscribeManifests = null;
        let unsubscribeCurrentScan = null;
        let currentManifestDoc = null; 
        
        // --- ЗВУК ---
        let audioCtx = null;
        
        function unlockAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0; 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.1);

            document.getElementById('sound-unlock-overlay').style.display = 'none';
            document.getElementById('scanner-input').focus();
        }

        function playTone(freq, type, duration, vol = 1) {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            // СТАРЫЙ ЗВУК УСПЕХА (Двойной приятный Дзинь)
            playTone(880, 'sine', 0.1, 0.5); 
            setTimeout(() => playTone(1108, 'sine', 0.2, 0.5), 100);
        }

        function playErrorSound() {
            // НОВЫЙ ЗВУК ОШИБКИ (Тревожная 2-секундная сирена)
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    playTone(250, 'square', 0.3, 0.5);
                    playTone(255, 'sawtooth', 0.3, 0.5);
                }, i * 400); // 5 гудков * 0.4 сек = 2 секунды
            }
        }

        // --- СУПЕР УМНЫЙ ПАРСЕР ДАННЫХ ---
        function parseExcelData(text) {
            const lines = text.split('\n');
            const items = [];
            const seen = new Set();

            lines.forEach(line => {
                line = line.trim();
                if(!line) return;

                let code = "";
                let brutto = "-", netto = "-", pcs = "-", totalPlaces = 1;

                if (line.includes('\t')) {
                    // Копирование из EXCEL таблицей
                    const cols = line.split('\t');
                    if (cols.length >= 2) {
                        // cols[0] = Страна (напр. PL), cols[1] = Номер (напр. MFPL0000034266/ biz)
                        code = cols[1].split('/')[0].trim().toUpperCase();
                    }
                    if (cols.length >= 8) {
                        totalPlaces = parseInt(cols[2], 10) || 1;
                        brutto = cols[4].trim() || "-";
                        netto = cols[5].trim() || "-";
                        pcs = cols[7].trim() || "-";
                    } else if (cols.length >= 5) {
                        totalPlaces = parseInt(cols[2], 10) || 1;
                    }
                } else {
                    // Копирование сплошным ТЕКСТОМ (без пробелов)
                    const paletaMatch = line.match(/(.*?)(\d+)\s*paleta(.*)/i);
                    if (paletaMatch) {
                        let rawPre = paletaMatch[1];
                        totalPlaces = parseInt(paletaMatch[2], 10) || 1;
                        
                        // Удаляем всё после слэша, если он есть
                        if (rawPre.includes('/')) {
                            rawPre = rawPre.split('/')[0];
                        }
                        rawPre = rawPre.trim();
                        
                        // Если вначале стоит 2 буквы страны (PL, DE, CZ, GB...) - отрезаем их
                        if (/^[A-Za-z]{2}/.test(rawPre)) {
                            rawPre = rawPre.substring(2);
                        }
                        code = rawPre.toUpperCase();
                    } else {
                        // Экстренный случай: просто ищем текст до слэша
                        const slashMatch = line.match(/(.*?)\//);
                        if (slashMatch) {
                            let rawPre = slashMatch[1].trim();
                            if (/^[A-Za-z]{2}/.test(rawPre)) {
                                rawPre = rawPre.substring(2);
                            }
                            code = rawPre.toUpperCase();
                        } else {
                            code = line.toUpperCase();
                        }
                    }
                }

                if (!code || code.length < 4) return;

                if (seen.has(code)) return; 
                seen.add(code);

                items.push({
                    code: code,
                    status: 'pending',
                    totalPlaces: totalPlaces,
                    scannedPlaces: 0,
                    scannedBy: null,
                    scannedAt: null,
                    brutto: brutto,
                    netto: netto,
                    pcs: pcs
                });
            });

            return items;
        }

        function updateManifestCount() {
            const text = document.getElementById('new-manifests-list').value;
            const items = parseExcelData(text);
            const counter = document.getElementById('manifest-counter');
            
            if (items.length > 0) {
                const totalPallets = items.reduce((sum, item) => sum + item.totalPlaces, 0);
                counter.innerText = `Распознано: ${items.length} манифестов (${totalPallets} палет)`;
                counter.className = "text-green-600 font-bold mb-4 h-6";
            } else {
                counter.innerText = `Номера пока не найдены...`;
                counter.className = "text-gray-500 mb-4 h-6";
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                loadDashboard();
            } else {
                currentUser = null;
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        function login() {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('login-error');
            auth.signInWithEmailAndPassword(e, p).catch(error => {
                err.innerText = "Ошибка входа!";
                err.classList.remove('hidden');
            });
        }

        function logout() { auth.signOut(); }

        function showCreateForm() {
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('new-car-number').value = '';
            document.getElementById('new-manifests-list').value = '';
            updateManifestCount();
        }

        function hideCreateForm() { document.getElementById('create-modal').classList.add('hidden'); }

        async function saveManifest() {
            const car = document.getElementById('new-car-number').value.trim();
            const text = document.getElementById('new-manifests-list').value;
            const items = parseExcelData(text);

            if (!car) return alert("Введите номер автомобиля!");
            if (items.length === 0) return alert("Не удалось распознать номера!");
            
            try {
                await db.collection('manifests').add({
                    carNumber: car,
                    creatorEmail: currentUser.email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    items: items,
                    errors: [],
                    status: 'pending'
                });
                hideCreateForm();
            } catch (err) {
                alert("Ошибка сохранения: " + err.message);
            }
        }

        async function deleteManifest(event, id) {
            event.stopPropagation();
            if (confirm("Удалить ведомость?")) {
                await db.collection('manifests').doc(id).delete();
            }
        }

        function loadDashboard() {
            if (unsubscribeManifests) unsubscribeManifests();
            
            unsubscribeManifests = db.collection('manifests')
                .orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    const grid = document.getElementById('manifests-grid');
                    grid.innerHTML = '';
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        
                        let totalPlaces = 0;
                        let scannedPlaces = 0;
                        
                        data.items.forEach(i => {
                            totalPlaces += (i.totalPlaces || 1);
                            scannedPlaces += (i.scannedPlaces !== undefined ? i.scannedPlaces : (i.status === 'scanned' ? (i.totalPlaces || 1) : 0));
                        });

                        const isCompleted = totalPlaces > 0 && scannedPlaces === totalPlaces;

                        const color = isCompleted ? 'bg-green-100 border-green-500' : 'bg-white border-blue-400';
                        const textColor = isCompleted ? 'text-green-700' : 'text-blue-800';
                        const barColor = isCompleted ? 'bg-green-500' : 'bg-blue-500';
                        const percent = totalPlaces > 0 ? (scannedPlaces / totalPlaces) * 100 : 0;

                        grid.innerHTML += `
                            <div onclick="openScanner('${doc.id}', '${data.carNumber}')" class="${color} border-l-4 p-4 rounded shadow cursor-pointer hover:shadow-md transition relative">
                                <button onclick="deleteManifest(event, '${doc.id}')" class="absolute top-2 right-2 text-gray-400 hover:text-red-600 bg-white bg-opacity-70 rounded p-1">✖</button>
                                <div class="flex justify-between items-start mb-2 pr-8">
                                    <h3 class="text-xl font-bold ${textColor}">${data.carNumber}</h3>
                                    <span class="text-sm font-bold ${textColor}">${scannedPlaces} / ${totalPlaces} мест</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                                    <div class="${barColor} h-2.5 rounded-full" style="width: ${percent}%"></div>
                                </div>
                                <div class="text-xs text-gray-500 mt-2">Создал: ${data.creatorEmail}</div>
                            </div>
                        `;
                    });
                });
        }

        // --- СКАНЕР ---
        let currentScanId = null;

        function openScanner(id, carNumber) {
            currentScanId = id;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('scan-screen').classList.remove('hidden');
            document.getElementById('scan-car-number').innerText = carNumber;
            
            document.getElementById('sound-unlock-overlay').style.display = 'flex';
            
            const input = document.getElementById('scanner-input');
            input.value = '';

            if (unsubscribeCurrentScan) unsubscribeCurrentScan();
            unsubscribeCurrentScan = db.collection('manifests').doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    currentManifestDoc = doc.data(); 
                    const data = doc.data();
                    
                    let totalPlaces = 0;
                    let scannedPlaces = 0;
                    
                    const listEl = document.getElementById('manifest-items-list');
                    listEl.innerHTML = '';
                    
                    data.items.forEach(item => {
                        const iTotal = item.totalPlaces || 1;
                        const iScanned = item.scannedPlaces !== undefined ? item.scannedPlaces : (item.status === 'scanned' ? iTotal : 0);
                        
                        totalPlaces += iTotal;
                        scannedPlaces += iScanned;
                        
                        let liClass, icon;
                        if (iScanned === iTotal) {
                            liClass = 'bg-green-100 text-green-800 opacity-70';
                            icon = '✓';
                        } else if (iScanned > 0 && iScanned < iTotal) {
                            liClass = 'bg-yellow-50 text-yellow-800 border-yellow-400 border-2';
                            icon = '🔄';
                        } else {
                            liClass = 'bg-white text-gray-900 border-gray-300 border-2';
                            icon = '⏳';
                        }
                        
                        listEl.innerHTML += `
                            <li class="p-2 rounded flex flex-col gap-1 ${liClass} transition-colors">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold">${icon}</span>
                                        <span class="font-bold text-sm md:text-base">${item.code}</span>
                                    </div>
                                    <span class="text-xs font-bold bg-white px-2 py-1 rounded opacity-80">${iScanned}/${iTotal} палет</span>
                                </div>
                                <div class="text-[10px] md:text-xs text-gray-600 font-mono ml-5">
                                    Вес: ${item.brutto}/${item.netto} | Шт: ${item.pcs}
                                </div>
                            </li>
                        `;
                    });
                    
                    document.getElementById('scan-count').innerText = scannedPlaces;
                    document.getElementById('scan-total').innerText = totalPlaces;

                } else {
                    closeScanner();
                }
            });
        }

        function closeScanner() {
            if (unsubscribeCurrentScan) unsubscribeCurrentScan();
            currentScanId = null;
            document.getElementById('scan-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        document.getElementById('scanner-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                processBarcode(this.value.trim());
                this.value = '';
            }
        });

        async function processBarcode(code) {
            if (!code || !currentScanId) return;
            const cleanCode = code.trim().toUpperCase();

            const docRef = db.collection('manifests').doc(currentScanId);
            const docSnap = await docRef.get();
            if (!docSnap.exists) return;

            const data = docSnap.data();
            const items = data.items;
            let alreadyScanned = false;
            let foundItem = null;

            for (let i = 0; i < items.length; i++) {
                if (items[i].code === cleanCode) {
                    const iTotal = items[i].totalPlaces || 1;
                    const iScanned = items[i].scannedPlaces !== undefined ? items[i].scannedPlaces : (items[i].status === 'scanned' ? iTotal : 0);

                    if (iScanned < iTotal) {
                        items[i].scannedPlaces = iScanned + 1;
                        items[i].scannedBy = currentUser.email;
                        items[i].scannedAt = new Date().toISOString();
                        
                        if (items[i].scannedPlaces === iTotal) {
                            items[i].status = 'scanned'; 
                        } else {
                            items[i].status = 'partial';
                        }
                        
                        foundItem = items[i];
                        await docRef.update({ items: items });
                        showSuccessFlash(foundItem);
                        return;
                    } else {
                        alreadyScanned = true;
                    }
                }
            }

            const errorMsg = alreadyScanned ? `Номер ${cleanCode} УЖЕ ПОЛНОСТЬЮ ЗАГРУЖЕН!` : `Номер ${cleanCode} ЧУЖОЙ!`;
            
            await docRef.update({
                errors: firebase.firestore.FieldValue.arrayUnion({
                    code: cleanCode,
                    message: alreadyScanned ? 'Повтор' : 'Лишний номер',
                    scannedBy: currentUser.email,
                    scannedAt: new Date().toISOString()
                })
            });

            showErrorOverlay(errorMsg);
        }

        function showSuccessFlash(item) {
            playSuccessSound();
            const area = document.getElementById('scan-flash-area');
            area.classList.remove('flash-green');
            void area.offsetWidth; 
            area.classList.add('flash-green');
            
            const isDone = item.scannedPlaces === (item.totalPlaces || 1);
            const statusText = isDone ? 'ЗАГРУЖЕНО' : 'В ПРОЦЕССЕ';
            
            document.getElementById('scan-last-result').innerHTML = `
                <div class="text-green-600 font-bold text-2xl md:text-3xl">✔ ${item.code}</div>
                <div class="text-gray-800 font-bold text-xl mt-2 bg-yellow-200 inline-block px-4 py-1 rounded">
                    ${item.scannedPlaces} из ${item.totalPlaces || 1} палет (${statusText})
                </div>
                <div class="text-gray-600 font-bold text-lg mt-2">Вес (B/N): ${item.brutto} / ${item.netto} кг</div>
            `;
        }

        function showErrorOverlay(message) {
            playErrorSound();
            document.getElementById('error-message').innerText = message;
            document.getElementById('error-overlay').style.display = 'flex';
            document.getElementById('scanner-input').blur(); 
        }

        function closeErrorOverlay() {
            document.getElementById('error-overlay').style.display = 'none';
            document.getElementById('scanner-input').focus(); 
        }

        // --- ПЕЧАТЬ PDF ---
        function generatePDF() {
            if (!currentManifestDoc) return;
            const data = currentManifestDoc;
            
            let totalPlaces = 0;
            let scannedPlaces = 0;
            data.items.forEach(i => {
                totalPlaces += (i.totalPlaces || 1);
                scannedPlaces += (i.scannedPlaces !== undefined ? i.scannedPlaces : (i.status === 'scanned' ? (i.totalPlaces || 1) : 0));
            });
            
            const dateStr = new Date().toLocaleString('ru-RU');

            let html = `
                <h1 style="text-align: center; font-size: 24px; font-family: sans-serif;">АКТ ЗАГРУЗКИ</h1>
                <p><strong>Автомобиль:</strong> ${data.carNumber}</p>
                <p><strong>Дата:</strong> ${dateStr}</p>
                <p><strong>Создал:</strong> ${data.creatorEmail}</p>
                <p><strong>Итог:</strong> Всего мест: ${totalPlaces} / Загружено мест: ${scannedPlaces}</p>
                
                <table class="print-table">
                    <thead><tr><th>№</th><th>Код</th><th>Места</th><th>Brutto</th><th>Netto</th><th>PCS</th><th>Статус</th></tr></thead>
                    <tbody>
            `;

            data.items.forEach((item, index) => {
                const iTotal = item.totalPlaces || 1;
                const iScanned = item.scannedPlaces !== undefined ? item.scannedPlaces : (item.status === 'scanned' ? iTotal : 0);
                const statusTxt = iScanned === iTotal ? 'ЗАГРУЖЕНО' : (iScanned > 0 ? 'ЧАСТИЧНО' : 'ОЖИДАЕТ');
                
                html += `<tr>
                    <td>${index + 1}</td>
                    <td>${item.code}</td>
                    <td>${iScanned} из ${iTotal}</td>
                    <td>${item.brutto}</td>
                    <td>${item.netto}</td>
                    <td>${item.pcs}</td>
                    <td>${statusTxt}</td>
                </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('print-area').innerHTML = html;
            document.getElementById('print-area').classList.remove('hidden');
            window.print();
        }

        window.onafterprint = function() { document.getElementById('print-area').classList.add('hidden'); };
    </script>
</body>
</html>
