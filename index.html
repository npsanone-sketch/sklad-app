<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Загрузкой Склада</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase (используем версию 8 для простоты интеграции в один файл) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* Анимации для сканера */
        @keyframes flashGreen {
            0% { background-color: #22c55e; }
            100% { background-color: transparent; }
        }
        @keyframes flashRed {
            0% { background-color: #ef4444; }
            100% { background-color: transparent; }
        }
        .flash-green { animation: flashGreen 0.8s ease-out; }
        .flash-red { animation: flashRed 1s ease-out; }
        
        /* Экран ошибки на весь экран */
        #error-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(239, 68, 68, 0.95);
            z-index: 50;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        /* Стили для печати (PDF) */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; color: black; }
            .no-print { display: none !important; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: left; }
            .print-table th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            .signature-block { margin-top: 50px; display: flex; justify-content: space-between; }
            .signature-line { border-bottom: 1px solid black; width: 200px; display: inline-block; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- Экран входа -->
    <div id="login-screen" class="absolute inset-0 z-40 bg-gray-100 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Вход в систему</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" class="w-full border rounded p-2" placeholder="ivan@sklad.local">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Пароль</label>
                <input type="password" id="password" class="w-full border rounded p-2" placeholder="******">
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Войти</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>
    </div>

    <!-- Верхняя панель (Header) -->
    <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center no-print">
        <div>
            <h1 class="text-xl font-bold">Склад - Загрузка</h1>
            <p id="user-info" class="text-sm text-blue-200"></p>
        </div>
        <button onclick="logout()" class="text-sm bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded">Выйти</button>
    </header>

    <!-- Главный экран (Список ведомостей) -->
    <div id="dashboard-screen" class="flex-1 overflow-auto p-4 hidden no-print">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Автомобили на загрузку</h2>
            <button onclick="showCreateForm()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow">
                + Создать ведомость
            </button>
        </div>

        <div id="manifests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Сюда будут загружаться автомобили -->
        </div>
    </div>

    <!-- Форма создания ведомости (Офис) -->
    <div id="create-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 flex items-center justify-center no-print">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Новая ведомость</h3>
            <input type="text" id="new-car-number" placeholder="Номер автомобиля (напр. АА 1234 ВВ)" class="w-full border rounded p-2 mb-4 font-bold text-lg">
            <label class="block text-sm font-medium mb-1">Список номеров (манифестов)</label>
            <textarea id="new-manifests-list" rows="6" placeholder="Вставьте номера сюда...&#10;Каждый номер с новой строки" class="w-full border rounded p-2 mb-4 font-mono text-sm"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="hideCreateForm()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Отмена</button>
                <button onclick="saveManifest()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 font-bold">Создать</button>
            </div>
        </div>
    </div>

    <!-- Экран сканирования (Склад) -->
    <div id="scan-screen" class="hidden flex-1 flex flex-col no-print bg-white">
        <div class="bg-gray-200 p-4 flex justify-between items-center border-b">
            <div>
                <button onclick="closeScanner()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded font-bold mr-3">← Назад</button>
                <span class="text-xl font-bold" id="scan-car-number">АВТОМОБИЛЬ</span>
            </div>
            <div class="flex gap-3">
                <div class="text-right">
                    <div class="text-2xl font-bold text-blue-600"><span id="scan-count">0</span> / <span id="scan-total">0</span></div>
                    <div class="text-xs text-gray-500">загружено</div>
                </div>
                <button onclick="generatePDF()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Акт
                </button>
            </div>
        </div>

        <div id="scan-flash-area" class="p-6 flex-1 flex flex-col items-center justify-center transition-colors">
            <h3 class="text-lg mb-2 text-gray-600 font-medium">Режим сканирования</h3>
            <!-- Огромное поле для ввода сканером -->
            <input type="text" id="scanner-input" autocomplete="off" autofocus class="w-full max-w-2xl text-center text-4xl font-mono border-4 border-blue-400 rounded-lg p-6 shadow-inner focus:outline-none focus:border-blue-600 focus:bg-blue-50" placeholder="Сканируйте штрих-код...">
            <button onclick="document.getElementById('scanner-input').focus()" class="mt-4 text-sm text-blue-500 underline">Вернуть фокус сканеру</button>
            
            <div id="scan-last-result" class="mt-8 text-2xl font-bold h-10"></div>
        </div>
    </div>

    <!-- Красная шторка ошибки сканирования -->
    <div id="error-overlay">
        <svg class="w-32 h-32 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <h1 class="text-6xl font-bold mb-4">ОШИБКА!</h1>
        <p class="text-2xl mb-8 text-center px-4" id="error-message">Неправильный номер или уже отсканирован</p>
        <button onclick="closeErrorOverlay()" class="bg-white text-red-600 font-bold py-4 px-12 rounded-full text-2xl shadow-lg hover:bg-gray-100">ПОНЯТНО (Закрыть)</button>
    </div>

    <!-- Зона для печати (PDF Акт) - скрыта на экране -->
    <div id="print-area" class="hidden bg-white p-8">
        <!-- Сюда скрипт сгенерирует документ -->
    </div>

    <script>
        // --- 1. НАСТРОЙКИ FIREBASE (ВАШИ КЛЮЧИ) ---
        const firebaseConfig = {
          apiKey: "AIzaSyBUp11R-Sq46IrW9lwH5uFjXXzli5OASsU",
          authDomain: "sklad-app-b04e3.firebaseapp.com",
          projectId: "sklad-app-b04e3",
          storageBucket: "sklad-app-b04e3.firebasestorage.app",
          messagingSenderId: "433669721018",
          appId: "1:433669721018:web:ec68089819da1d5f952b83"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let unsubscribeManifests = null;
        let unsubscribeCurrentScan = null;
        let currentManifestDoc = null; // Хранит текущие данные для печати
        
        // --- ЗВУКИ (WEB AUDIO API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(freq, type, duration, vol = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            playTone(880, 'sine', 0.1, 0.5); // Короткий Дзинь
            setTimeout(() => playTone(1108, 'sine', 0.2, 0.5), 100);
        }

        function playErrorSound() {
            playTone(150, 'sawtooth', 0.4, 1); // Резкий неприятный звук
            playTone(155, 'sawtooth', 0.4, 1);
        }

        // --- АВТОРИЗАЦИЯ ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                loadDashboard();
            } else {
                currentUser = null;
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('hidden');
                document.getElementById('scan-screen').classList.add('hidden');
            }
        });

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            auth.signInWithEmailAndPassword(e, p).catch(error => {
                err.innerText = "Ошибка: " + error.message;
                err.classList.remove('hidden');
            });
        }

        function logout() {
            auth.signOut();
        }

        // --- ГЛАВНЫЙ ЭКРАН (ОФИС) ---
        function showCreateForm() {
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('new-car-number').value = '';
            document.getElementById('new-manifests-list').value = '';
        }

        function hideCreateForm() {
            document.getElementById('create-modal').classList.add('hidden');
        }

        async function saveManifest() {
            const car = document.getElementById('new-car-number').value.trim();
            const text = document.getElementById('new-manifests-list').value.trim();
            if (!car || !text) return alert("Заполните номер авто и список!");

            // Разбиваем текст на строки, убираем пустые
            const items = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            
            const manifestData = {
                carNumber: car,
                creatorEmail: currentUser.email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                items: items.map(code => ({ code: code, status: 'pending', scannedBy: null, scannedAt: null })),
                errors: [],
                status: 'pending' // pending или completed
            };

            await db.collection('manifests').add(manifestData);
            hideCreateForm();
        }

        function loadDashboard() {
            if (unsubscribeManifests) unsubscribeManifests();
            
            unsubscribeManifests = db.collection('manifests')
                .orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    const grid = document.getElementById('manifests-grid');
                    grid.innerHTML = '';
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const total = data.items.length;
                        const scanned = data.items.filter(i => i.status === 'scanned').length;
                        const isCompleted = total > 0 && scanned === total;
                        
                        // Авто-обновление статуса в базе (опционально)
                        if (isCompleted && data.status !== 'completed') {
                            db.collection('manifests').doc(doc.id).update({ status: 'completed' });
                        }

                        const color = isCompleted ? 'bg-green-100 border-green-500' : 'bg-red-50 border-red-500';
                        const textColor = isCompleted ? 'text-green-700' : 'text-red-700';
                        const barColor = isCompleted ? 'bg-green-500' : 'bg-red-500';
                        const percent = total > 0 ? (scanned / total) * 100 : 0;

                        grid.innerHTML += `
                            <div onclick="openScanner('${doc.id}', '${data.carNumber}')" class="${color} border-l-4 p-4 rounded shadow cursor-pointer hover:shadow-md transition">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold ${textColor}">${data.carNumber}</h3>
                                    <span class="text-sm font-bold ${textColor}">${scanned} / ${total}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                                    <div class="${barColor} h-2.5 rounded-full" style="width: ${percent}%"></div>
                                </div>
                                <div class="text-xs text-gray-500 mt-2">Создал: ${data.creatorEmail}</div>
                                ${data.errors && data.errors.length > 0 ? `<div class="text-xs text-red-600 mt-1 font-bold">Ошибок сканирования: ${data.errors.length}</div>` : ''}
                            </div>
                        `;
                    });
                });
        }

        // --- СКАНЕР (СКЛАД) ---
        let currentScanId = null;

        function openScanner(id, carNumber) {
            // Включаем AudioContext (требование браузеров)
            if (audioCtx.state === 'suspended') audioCtx.resume();

            currentScanId = id;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('scan-screen').classList.remove('hidden');
            document.getElementById('scan-car-number').innerText = carNumber;
            
            const input = document.getElementById('scanner-input');
            input.value = '';
            input.focus();

            // Подписка на изменения конкретной ведомости в реальном времени
            if (unsubscribeCurrentScan) unsubscribeCurrentScan();
            unsubscribeCurrentScan = db.collection('manifests').doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    currentManifestDoc = doc.data(); // Сохраняем для PDF
                    const data = doc.data();
                    const total = data.items.length;
                    const scanned = data.items.filter(i => i.status === 'scanned').length;
                    document.getElementById('scan-count').innerText = scanned;
                    document.getElementById('scan-total').innerText = total;
                }
            });
        }

        function closeScanner() {
            if (unsubscribeCurrentScan) unsubscribeCurrentScan();
            currentScanId = null;
            document.getElementById('scan-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        // Обработка ввода со сканера (сканер обычно вводит текст и нажимает Enter)
        document.getElementById('scanner-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                processBarcode(this.value.trim());
                this.value = ''; // Очищаем для следующего сканирования
            }
        });

        async function processBarcode(code) {
            if (!code || !currentScanId) return;

            const docRef = db.collection('manifests').doc(currentScanId);
            const docSnap = await docRef.get();
            if (!docSnap.exists) return;

            const data = docSnap.data();
            const items = data.items;
            let itemFound = false;
            let alreadyScanned = false;

            // Ищем штрихкод в списке
            for (let i = 0; i < items.length; i++) {
                if (items[i].code === code) {
                    itemFound = true;
                    if (items[i].status === 'pending') {
                        // УСПЕХ: Нашли и он еще не отсканирован
                        items[i].status = 'scanned';
                        items[i].scannedBy = currentUser.email;
                        items[i].scannedAt = new Date().toISOString();
                        
                        await docRef.update({ items: items });
                        
                        showSuccessFlash(code);
                        return; // Выходим
                    } else {
                        alreadyScanned = true;
                    }
                }
            }

            // ОШИБКА: Если не нашли или уже отсканирован
            const errorMsg = alreadyScanned ? `Номер ${code} УЖЕ БЫЛ ЗАГРУЖЕН!` : `Номер ${code} ЧУЖОЙ (нет в ведомости)!`;
            
            // Записываем ошибку в базу
            const newError = {
                code: code,
                message: alreadyScanned ? 'Повторное сканирование' : 'Лишний номер',
                scannedBy: currentUser.email,
                scannedAt: new Date().toISOString()
            };
            
            await docRef.update({
                errors: firebase.firestore.FieldValue.arrayUnion(newError)
            });

            showErrorOverlay(errorMsg);
        }

        // --- ВИЗУАЛИЗАЦИЯ И ЗВУКИ ---
        function showSuccessFlash(code) {
            playSuccessSound();
            const area = document.getElementById('scan-flash-area');
            area.classList.remove('flash-green');
            void area.offsetWidth; // Магия для перезапуска анимации
            area.classList.add('flash-green');
            
            const resultDiv = document.getElementById('scan-last-result');
            resultDiv.innerHTML = `<span class="text-green-600">✔ ${code} загружен</span>`;
        }

        function showErrorOverlay(message) {
            playErrorSound();
            document.getElementById('error-message').innerText = message;
            document.getElementById('error-overlay').style.display = 'flex';
            document.getElementById('scanner-input').blur(); // Снимаем фокус
        }

        function closeErrorOverlay() {
            document.getElementById('error-overlay').style.display = 'none';
            const input = document.getElementById('scanner-input');
            input.focus(); // Возвращаем фокус сканеру
        }

        // --- ГЕНЕРАЦИЯ PDF (ПЕЧАТЬ) ---
        function generatePDF() {
            if (!currentManifestDoc) return;
            const data = currentManifestDoc;
            
            const total = data.items.length;
            const scanned = data.items.filter(i => i.status === 'scanned').length;
            const pending = total - scanned;
            
            const dateStr = new Date().toLocaleString('ru-RU');

            let html = `
                <h1 style="text-align: center; font-size: 24px; font-family: sans-serif;">АКТ ЗАГРУЗКИ ТРАНСПОРТНОГО СРЕДСТВА</h1>
                <p><strong>Автомобиль:</strong> ${data.carNumber}</p>
                <p><strong>Дата формирования акта:</strong> ${dateStr}</p>
                <p><strong>Ведомость создал:</strong> ${data.creatorEmail}</p>
                <p><strong>Статус:</strong> Всего: ${total} шт. / Загружено: ${scanned} шт. / Не загружено: ${pending} шт.</p>
                
                <h3 style="margin-top:20px; font-family: sans-serif;">Список загруженных отправлений:</h3>
                <table class="print-table">
                    <thead><tr><th>№</th><th>Номер манифеста</th><th>Статус</th><th>Сотрудник (Склад)</th></tr></thead>
                    <tbody>
            `;

            // Заполняем таблицу
            data.items.forEach((item, index) => {
                const statusTxt = item.status === 'scanned' ? 'ЗАГРУЖЕНО' : 'ОЖИДАЕТ';
                const emp = item.scannedBy ? item.scannedBy : '-';
                html += `<tr><td>${index + 1}</td><td>${item.code}</td><td>${statusTxt}</td><td>${emp}</td></tr>`;
            });

            html += `</tbody></table>`;

            // Если есть ошибки, добавляем их
            if (data.errors && data.errors.length > 0) {
                html += `
                    <h3 style="margin-top:30px; color: red; font-family: sans-serif;">Ошибочные сканирования:</h3>
                    <table class="print-table">
                        <thead><tr><th>№</th><th>Отсканированный код</th><th>Тип ошибки</th><th>Сотрудник</th></tr></thead>
                        <tbody>
                `;
                data.errors.forEach((err, index) => {
                    html += `<tr><td>${index + 1}</td><td>${err.code}</td><td>${err.message}</td><td>${err.scannedBy}</td></tr>`;
                });
                html += `</tbody></table>`;
            }

            // Подписи
            html += `
                <div class="signature-block">
                    <div>
                        <p>Сдал (Склад): _______________________</p>
                    </div>
                    <div>
                        <p>Принял (Водитель): _______________________</p>
                    </div>
                </div>
            `;

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = html;
            
            // Вызываем системное окно печати (в котором можно сохранить как PDF)
            window.print();
        }
    </script>
</body>
</html>
