<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад - Загрузка / Выгрузка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @keyframes flashGreen { 0% { background-color: #22c55e; } 100% { background-color: transparent; } }
        @keyframes flashRed { 0% { background-color: #ef4444; } 100% { background-color: transparent; } }
        @keyframes flashOrange { 0% { background-color: #f97316; } 100% { background-color: transparent; } }
        
        @keyframes urgentBlink {
            0%, 100% { box-shadow: 0 0 20px 5px rgba(239, 68, 68, 0.8); border-color: #ef4444; background-color: #fef2f2; transform: scale(1.02); }
            50% { box-shadow: none; border-color: #d1d5db; background-color: #ffffff; transform: scale(1); }
        }

        .flash-green { animation: flashGreen 1s ease-out; }
        .flash-red { animation: flashRed 2s ease-out; }
        .flash-orange { animation: flashOrange 1s ease-out; }
        
        .urgent-blink { animation: urgentBlink 1.5s infinite; border-width: 4px; }
        
        #error-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(239, 68, 68, 0.95); z-index: 50; justify-content: center; align-items: center; flex-direction: column; color: white; }
        
        #sound-unlock-overlay { display: none; position: absolute; inset: 0; background-color: rgba(30, 58, 138, 0.95); z-index: 40; justify-content: center; align-items: center; flex-direction: column; color: white; }

        @media print {
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block !important; position: static; width: 100%; color: black; padding: 20px; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 6px; text-align: left; }
            .print-table th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            .signature-block { margin-top: 40px; display: flex; justify-content: space-between; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- Экран входа -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-gray-100 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">Вход в систему</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" class="w-full border rounded p-2" placeholder="email@sklad.ru">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Пароль</label>
                <input type="password" id="password" class="w-full border rounded p-2" placeholder="******">
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Войти</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>
    </div>

    <!-- Верхняя панель -->
    <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center no-print shrink-0">
        <div>
            <h1 class="text-xl font-bold">Склад Контроль</h1>
            <p id="user-info" class="text-sm text-blue-200"></p>
        </div>
        <button onclick="logout()" class="text-sm bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded">Выйти</button>
    </header>

    <!-- Главный экран -->
    <div id="dashboard-screen" class="flex-1 overflow-auto p-4 hidden no-print">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <h2 class="text-2xl font-bold">Активные ведомости</h2>
            <button onclick="showCreateForm()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow w-full sm:w-auto">
                + Создать ведомость

        </div>
        <div id="manifests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Форма создания / редактирования -->
    <div id="create-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center no-print p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md md:max-w-xl">
            <h3 id="modal-title" class="text-xl font-bold mb-4">Новая ведомость</h3>
            
            <div class="flex gap-4 mb-4">
                <select id="new-manifest-type" class="w-1/2 border rounded p-2 font-bold text-sm bg-gray-50">
                    <option value="load">🟢 ЗАГРУЗКА АВТО</option>
                    <option value="unload">🟣 ВЫГРУЗКА ИЗ АВТО</option>
                </select>
                <input type="text" id="new-car-number" placeholder="Номер авто (АА 1234)" class="w-1/2 border rounded p-2 font-bold text-lg">
            </div>
            
            <label class="block text-sm font-medium mb-1">Скопируйте таблицу из Excel и вставьте сюда:</label>
            <textarea id="new-manifests-list" rows="6" oninput="updateManifestCount()" placeholder="Вставьте скопированные данные..." class="w-full border rounded p-2 mb-1 font-mono text-xs whitespace-pre"></textarea>

            <div class="flex justify-end gap-2">

                </div>
                <div class="flex-1 overflow-y-auto p-2">

    <div id="error-overlay">

    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBUp11R-Sq46IrW9lwH5uFjXXzli5OASsU",
          authDomain: "sklad-app-b04e3.firebaseapp.com",
          projectId: "sklad-app-b04e3",
          storageBucket: "sklad-app-b04e3.firebasestorage.app",
          messagingSenderId: "433669721018",
          appId: "1:433669721018:web:ec68089819da1d5f952b83"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let unsubscribeManifests = null;
        let unsubscribeCurrentScan = null;
        let currentManifestDoc = null; 
        let editingManifestId = null;
        
        let audioCtx = null;
        
        function unlockAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0; 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.1);

            document.getElementById('sound-unlock-overlay').style.display = 'none';
            document.getElementById('scanner-input').focus();
        }

        function playTone(freq, type, duration, vol = 1) {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            playTone(880, 'sine', 0.1, 0.5); 
            setTimeout(() => playTone(1108, 'sine', 0.2, 0.5), 100);
        }

        function playErrorSound() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    playTone(250, 'square', 0.3, 0.5);
                    playTone(255, 'sawtooth', 0.3, 0.5);
                }, i * 400); 
            }
        }

        function parseExcelData(text) {
            const lines = text.split('\n');
            const items = [];
            const seen = new Set();

            lines.forEach(line => {
                line = line.trim();
                if(!line) return;

                let code = "";
                let brutto = "-", netto = "-", pcs = "-", totalPlaces = 1;

                if (line.includes('\t')) {
                    const cols = line.split('\t').map(c => c.trim());
                    
                    let codeCol = "";
                    for (let i = 0; i < Math.min(3, cols.length); i++) {
                        if (cols[i].length > codeCol.length) {
                            codeCol = cols[i];
                        }
                    }
                    
                    if (codeCol.includes('/')) codeCol = codeCol.split('/')[0];
                    code = codeCol.trim().toUpperCase();
                    if (/^[A-Z]{2}MF/.test(code)) code = code.substring(2);

                    let paletaIdx = cols.findIndex(c => c.toLowerCase().includes('paleta'));
                    if (paletaIdx > 0) {
                        totalPlaces = parseInt(cols[paletaIdx - 1], 10) || 1;
                    } else {
                        let numCol = cols.find((c, idx) => idx > 0 && c.length > 0 && !isNaN(parseInt(c, 10)));
                        if (numCol) totalPlaces = parseInt(numCol, 10) || 1;
                    }

                    if (paletaIdx >= 0 && paletaIdx + 4 < cols.length) {
                        brutto = cols[paletaIdx + 1] || "-";
                        netto = cols[paletaIdx + 2] || "-";
                        pcs = cols[paletaIdx + 4] || "-";
                    } else if (cols.length >= 6) {
                        brutto = cols[cols.length - 4] || "-";
                        netto = cols[cols.length - 3] || "-";
                        pcs = cols[cols.length - 1] || "-";
                    }
                } else {
                    const paletaMatch = line.match(/(.*?)(\d+)\s*paleta(.*)/i);
                    if (paletaMatch) {
                        let pre = paletaMatch[1].trim();
                        totalPlaces = parseInt(paletaMatch[2], 10) || 1;
                        if (pre.includes('/')) pre = pre.split('/')[0];
                        const words = pre.split(/\s+/);
                        code = words.reduce((long, cur) => cur.length > long.length ? cur : long, "").toUpperCase();
                        if (/^[A-Z]{2}MF/.test(code)) code = code.substring(2);
                    } else {
                        let pre = line;
                        if (pre.includes('/')) pre = pre.split('/')[0];
                        const words = pre.split(/\s+/);
                        code = words.reduce((long, cur) => cur.length > long.length ? cur : long, "").toUpperCase();
                        if (/^[A-Z]{2}MF/.test(code)) code = code.substring(2);
                    }
                }

                if (!code || code.length < 4) return;
                if (seen.has(code)) return;
                seen.add(code);

                items.push({
                    code: code,
                    status: 'pending',
                    isCancelled: false,
                    totalPlaces: totalPlaces,
                    scannedPlaces: 0,
                    scannedBy: null,
                    scannedAt: null,
                    brutto: brutto,
                    netto: netto,
                    pcs: pcs
                });
            });

            return items;
        }

        function updateManifestCount() {
            const text = document.getElementById('new-manifests-list').value;
            const items = parseExcelData(text);
            const counter = document.getElementById('manifest-counter');
            
            if (items.length > 0) {
                const totalPallets = items.reduce((sum, item) => sum + item.totalPlaces, 0);
                counter.innerText = `Распознано: ${items.length} манифестов (${totalPallets} палет)`;
                counter.className = "text-green-600 font-bold mb-4 h-6";
            } else {
                counter.innerText = `Номера пока не найдены...`;
                counter.className = "text-gray-500 mb-4 h-6";
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                loadDashboard();
            } else {
                currentUser = null;
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        function login() {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('login-error');
            auth.signInWithEmailAndPassword(e, p).catch(error => {
                err.innerText = "Ошибка входа!";
                err.classList.remove('hidden');
            });
        }

        function logout() { auth.signOut(); }

        function showCreateForm() {
            editingManifestId = null;
            document.getElementById('modal-title').innerText = 'Новая ведомость';
            document.getElementById('new-car-number').value = '';
            document.getElementById('new-manifests-list').value = '';
            document.getElementById('new-manifest-type').disabled = false;
            document.getElementById('new-manifest-type').value = 'load';
            document.getElementById('create-modal').classList.remove('hidden');
            updateManifestCount();
        }

        async function editManifest(event, id) {
            event.stopPropagation();
            const docSnap = await db.collection('manifests').doc(id).get();
            if (!docSnap.exists) return;
            
            const data = docSnap.data();
            editingManifestId = id;
            
            document.getElementById('modal-title').innerText = 'Редактирование ведомости';
            document.getElementById('new-car-number').value = data.carNumber;
            document.getElementById('new-manifest-type').value = data.docType || 'load';
            document.getElementById('new-manifest-type').disabled = true; 
            
            const text = data.items
                .filter(i => i.status !== 'removed')
                .map(i => `${i.code}\t\t${i.totalPlaces} paleta\t\t${i.brutto}\t${i.netto}\t\t${i.pcs}`)
                .join('\n');
                
            document.getElementById('new-manifests-list').value = text;
            document.getElementById('create-modal').classList.remove('hidden');
            updateManifestCount();
        }

        function hideCreateForm() { document.getElementById('create-modal').classList.add('hidden'); }

        async function saveManifest() {
            const car = document.getElementById('new-car-number').value.trim();
            const docType = document.getElementById('new-manifest-type').value;
            const text = document.getElementById('new-manifests-list').value;
            const newItemsParsed = parseExcelData(text);

            if (!car) return alert("Введите номер автомобиля!");
            if (newItemsParsed.length === 0) return alert("Не удалось распознать номера!");
            
            try {
                if (editingManifestId) {
                    const docRef = db.collection('manifests').doc(editingManifestId);
                    const docSnap = await docRef.get();
                    const data = docSnap.data();
                    const oldItems = data.items;
                    let mergedItems = [];
                    
                    let addedLog = [];
                    let removedLog = [];
                    let changedLog = [];

                    // Проверяем старые манифесты
                    oldItems.forEach(oldItem => {
                        const foundInNew = newItemsParsed.find(n => n.code === oldItem.code);
                        if (foundInNew) {
                            if (oldItem.totalPlaces !== foundInNew.totalPlaces) {
                                changedLog.push(`${oldItem.code} (${oldItem.totalPlaces} шт ➡️ ${foundInNew.totalPlaces} шт)`);
                            }
                            oldItem.totalPlaces = foundInNew.totalPlaces;
                            oldItem.brutto = foundInNew.brutto;
                            oldItem.netto = foundInNew.netto;
                            oldItem.pcs = foundInNew.pcs;
                            oldItem.isCancelled = false;
                            
                            if (oldItem.status === 'removed') {
                                oldItem.status = oldItem.scannedPlaces >= oldItem.totalPlaces ? 'scanned' : (oldItem.scannedPlaces > 0 ? 'partial' : 'pending');
                            }
                            mergedItems.push(oldItem);
                        } else {
                            // Удалили из списка
                            removedLog.push(oldItem.code);
                            if (oldItem.scannedPlaces > 0 && oldItem.status !== 'removed') {
                                oldItem.isCancelled = true;
                                mergedItems.push(oldItem);
                            } 
                            // Если не сканировался - просто исчезает из mergedItems
                        }
                    });

                    // Проверяем новые манифесты
                    newItemsParsed.forEach(newItem => {
                        const foundInOld = oldItems.find(o => o.code === newItem.code);
                        if (!foundInOld) {
                            addedLog.push(newItem.code);
                            mergedItems.push(newItem);
                        }
                    });

                    const editHistory = data.editHistory || [];
                    let isModifiedFlag = data.modified || false;

                    if (addedLog.length > 0 || removedLog.length > 0 || changedLog.length > 0) {
                        editHistory.push({
                            editedAt: new Date().toISOString(),
                            editedBy: currentUser.email,
                            added: addedLog,
                            removed: removedLog,
                            changed: changedLog
                        });
                        isModifiedFlag = true;
                    }

                    await docRef.update({ 
                        carNumber: car,
                        items: mergedItems,
                        editHistory: editHistory,
                        modified: isModifiedFlag
                    });
                } else {
                    await db.collection('manifests').add({
                        carNumber: car,
                        docType: docType,
                        creatorEmail: currentUser.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        items: newItemsParsed,
                        errors: [],
                        editHistory: [],
                        modified: false,
                        status: 'pending'
                    });
                }
                hideCreateForm();
            } catch (err) {
                alert("Ошибка сохранения: " + err.message);
            }
        }

        async function deleteManifest(event, id) {
            event.stopPropagation();
            if (confirm("Полностью удалить ведомость?")) {
                await db.collection('manifests').doc(id).delete();
            }
        }

        function loadDashboard() {
            if (unsubscribeManifests) unsubscribeManifests();
            
            unsubscribeManifests = db.collection('manifests')
                .orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    const grid = document.getElementById('manifests-grid');
                    grid.innerHTML = '';
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        
                        let totalPlaces = 0;
                        let scannedPlaces = 0;
                        let lastScanDt = null;
                        
                        let needsReturn = false;
                        let returnList = [];
                        
                        const isLoad = !data.docType || data.docType === 'load';

                        data.items.forEach(i => {
                            if (i.isCancelled && i.scannedPlaces > 0) {
                                needsReturn = true;
                                returnList.push(`${i.code} (${i.scannedPlaces} шт)`);
                            }

                            if (i.status !== 'removed') {
                                totalPlaces += (i.totalPlaces || 1);
                                scannedPlaces += (i.scannedPlaces !== undefined ? i.scannedPlaces : (i.status === 'scanned' ? (i.totalPlaces || 1) : 0));
                            }
                            if (i.scannedAt && !i.isCancelled) {
                                let dt = new Date(i.scannedAt);
                                if (!lastScanDt || dt > lastScanDt) lastScanDt = dt;
                            }
                        });

                        const isCompleted = totalPlaces > 0 && scannedPlaces === totalPlaces;

                        let durationHtml = '';
                        if (isCompleted && data.createdAt && lastScanDt && !needsReturn) {
                            let createdDt = typeof data.createdAt.toDate === 'function' ? data.createdAt.toDate() : new Date(data.createdAt);
                            let diffSecs = Math.floor((lastScanDt - createdDt) / 1000);
                            if (diffSecs >= 0) {
                                let h = Math.floor(diffSecs / 3600);
                                let m = Math.floor((diffSecs % 3600) / 60);
                                durationHtml = `<div class="text-xs text-gray-700 mt-2 font-bold bg-white bg-opacity-50 p-1 rounded inline-block">⏱ Время работы: ${h > 0 ? h + ' ч ' : ''}${m} мин</div>`;
                            }
                        }

                        let typeBadge = isLoad 
                            ? '<span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold shadow-sm">ЗАГРУЗКА</span>'
                            : '<span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded font-bold shadow-sm">ВЫГРУЗКА</span>';

                        // Индикатор простого изменения
                        if (data.modified && !isCompleted && !needsReturn) {
                            typeBadge += ' <span class="text-xs bg-yellow-200 text-yellow-800 px-2 py-1 rounded font-bold ml-1 shadow-sm">⚠️ ИЗМЕНЕНА</span>';
                        }

                        let cardClass = isLoad 
                            ? (isCompleted ? 'bg-green-100 border-green-500' : 'bg-white border-blue-400')
                            : (isCompleted ? 'bg-orange-100 border-orange-500' : 'bg-white border-purple-400');
                        
                        // Если изменена и еще не завершена (без экстренного возврата) - делаем желтоватой
                        if (data.modified && !isCompleted && !needsReturn) {
                            cardClass = 'bg-yellow-50 border-yellow-400';
                        }
                        
                        let textColor = isLoad 
                            ? (isCompleted ? 'text-green-700' : 'text-blue-800')
                            : (isCompleted ? 'text-orange-700' : 'text-purple-800');
                            
                        let barColor = isLoad 
                            ? (isCompleted ? 'bg-green-500' : 'bg-blue-500')
                            : (isCompleted ? 'bg-orange-500' : 'bg-purple-500');

                        let returnAlertHtml = '';

                        // ЕСЛИ ЕСТЬ ОТМЕНЫ (Мигание и список)
                        if (needsReturn) {
                            cardClass = 'urgent-blink';
                            textColor = 'text-red-900';
                            returnAlertHtml = `
                                <div class="mt-3 bg-red-600 text-white p-2 rounded shadow-inner border border-red-800">
                                    <div class="text-sm font-bold mb-1">⚠️ ИЗМЕНЕНИЕ! ВЕРНУТЬ:</div>
                                    <div class="font-mono text-xs leading-tight">${returnList.join(', ')}</div>
                                </div>
                            `;
                        }

                        const percent = totalPlaces > 0 ? (scannedPlaces / totalPlaces) * 100 : 0;

                        grid.innerHTML += `
                            <div onclick="openScanner('${doc.id}', '${data.carNumber}')" class="${cardClass} border-l-4 p-4 rounded shadow cursor-pointer hover:shadow-md transition relative">
                                <div class="absolute top-2 right-2 flex gap-1 z-10">
                                    <button onclick="editManifest(event, '${doc.id}')" class="text-gray-600 hover:text-blue-600 bg-gray-100 hover:bg-white rounded p-1 shadow-sm border border-gray-200 transition" title="Редактировать">✏️</button>
                                    <button onclick="deleteManifest(event, '${doc.id}')" class="text-gray-600 hover:text-red-600 bg-gray-100 hover:bg-white rounded p-1 shadow-sm border border-gray-200 transition" title="Удалить">✖</button>
                                </div>
                                <div class="mb-3 pr-16">
                                    ${typeBadge}
                                </div>
                                <div class="flex justify-between items-end mb-2 pr-16">
                                    <h3 class="text-xl font-bold ${textColor} leading-none">${data.carNumber}</h3>
                                    <span class="text-sm font-bold ${textColor}">${scannedPlaces} / ${totalPlaces} мест</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                                    <div class="${barColor} h-2.5 rounded-full" style="width: ${percent}%"></div>
                                </div>
                                <div class="text-xs text-gray-500 mt-2">Создал: ${data.creatorEmail}</div>
                                ${durationHtml}
                                ${returnAlertHtml}
                            </div>
                        `;
                    });
                });
        }

        let currentScanId = null;

        function openScanner(id, carNumber) {
            currentScanId = id;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('scan-screen').classList.remove('hidden');
            document.getElementById('scan-car-number').innerText = carNumber;
            
            document.getElementById('sound-unlock-overlay').style.display = 'flex';
            
            const input = document.getElementById('scanner-input');
            input.value = '';

            if (unsubscribeCurrentScan) unsubscribeCurrentScan();
            unsubscribeCurrentScan = db.collection('manifests').doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    currentManifestDoc = doc.data(); 
                    const data = doc.data();
                    const isLoad = !data.docType || data.docType === 'load';
                    
                    const docTypeBadge = document.getElementById('scan-doc-type');
                    const actionWord = document.getElementById('scan-action-word');
                    if (isLoad) {
                        docTypeBadge.innerText = 'ЗАГРУЗКА';
                        docTypeBadge.className = 'ml-2 text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold';
                        actionWord.innerText = 'загружено';
                    } else {
                        docTypeBadge.innerText = 'ВЫГРУЗКА';
                        docTypeBadge.className = 'ml-2 text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded font-bold';
                        actionWord.innerText = 'выгружено';
                    }

                    let totalPlaces = 0;
                    let scannedPlaces = 0;
                    let returns = [];
                    
                    const listEl = document.getElementById('manifest-items-list');
                    listEl.innerHTML = '';
                    
                    data.items.forEach(item => {
                        if (item.status === 'removed') return; 

                        const iTotal = item.totalPlaces || 1;
                        const iScanned = item.scannedPlaces !== undefined ? item.scannedPlaces : (item.status === 'scanned' ? iTotal : 0);
                        
                        if (!item.isCancelled) {
                            totalPlaces += iTotal;
                            scannedPlaces += iScanned;
                        } else if (iScanned > 0) {
                            returns.push(`${item.code} (${iScanned} шт)`);
                        }
                        
                        let liClass, icon, specialBadge = '';
                        
                        if (item.isCancelled) {
                            liClass = 'bg-red-100 text-red-900 border-red-500 border-2 animate-pulse';
                            icon = '⚠️';
                            specialBadge = `<span class="bg-red-500 text-white px-2 py-1 rounded text-xs font-bold">ОТМЕНА! Вернуть: ${iScanned} шт</span>`;
                        } else if (iScanned === iTotal) {
                            liClass = isLoad ? 'bg-green-100 text-green-800 opacity-70' : 'bg-orange-100 text-orange-800 opacity-70';
                            icon = '✓';
                        } else if (iScanned > 0 && iScanned < iTotal) {
                            liClass = 'bg-yellow-50 text-yellow-800 border-yellow-400 border-2';
                            icon = '🔄';
                        } else {
                            liClass = 'bg-white text-gray-900 border-gray-300 border-2';
                            icon = '⏳';
                        }
                        
                        let timeHtml = '';
                        if (item.scannedAt && !item.isCancelled) {
                            const dt = new Date(item.scannedAt);
                            timeHtml = `<span class="text-xs text-blue-700 ml-2 font-bold">${dt.toLocaleTimeString('ru-RU')}</span>`;
                        }

                        listEl.innerHTML += `
                            <li class="p-2 rounded flex flex-col gap-1 ${liClass} transition-colors">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold">${icon}</span>
                                        <span class="font-bold text-sm md:text-base ${item.isCancelled ? 'line-through' : ''}">${item.code}</span>
                                        ${timeHtml}
                                    </div>
                                    ${item.isCancelled ? specialBadge : `<span class="text-xs font-bold bg-white px-2 py-1 rounded opacity-80 border">${iScanned}/${iTotal} палет</span>`}
                                </div>
                                <div class="text-[10px] md:text-xs text-gray-600 font-mono ml-5">
                                    Вес: ${item.brutto}/${item.netto} | Шт: ${item.pcs}
                                </div>
                            </li>
                        `;
                    });
                    
                    document.getElementById('scan-count').innerText = scannedPlaces;
                    document.getElementById('scan-total').innerText = totalPlaces;

                    const alertBar = document.getElementById('scan-alert-bar');
                    if (returns.length > 0) {
                        alertBar.innerHTML = `⚠️ ВНИМАНИЕ, ИЗМЕНЕНИЯ! НУЖНО ВЕРНУТЬ:<br><span class="font-mono text-sm">${returns.join(', ')}</span>`;
                        alertBar.classList.remove('hidden');
                    } else {
                        alertBar.classList.add('hidden');
                    }

                } else {
                    closeScanner();
                }
            });
        }

        function closeScanner() {
            if (unsubscribeCurrentScan) unsubscribeCurrentScan();
            currentScanId = null;
            document.getElementById('scan-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        document.getElementById('scanner-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                processBarcode(this.value.trim());
                this.value = '';
            }
        });

        async function processBarcode(code) {
            if (!code || !currentScanId) return;
            const cleanCode = code.trim().toUpperCase();

            const docRef = db.collection('manifests').doc(currentScanId);
            const docSnap = await docRef.get();
            if (!docSnap.exists) return;

            const data = docSnap.data();
            const items = data.items;
            let alreadyScanned = false;
            let foundItem = null;
            let isUndoMode = false;

            for (let i = 0; i < items.length; i++) {
                if (items[i].code === cleanCode) {
                    
                    if (items[i].isCancelled && items[i].scannedPlaces > 0) {
                        items[i].scannedPlaces -= 1;
                        items[i].scannedBy = currentUser.email;
                        items[i].scannedAt = new Date().toISOString();
                        
                        if (items[i].scannedPlaces === 0) {
                            items[i].status = 'removed';
                            items[i].isCancelled = false;
                        }
                        
                        foundItem = items[i];
                        isUndoMode = true;
                        await docRef.update({ items: items });
                        showSuccessFlash(foundItem, true);
                        return;

                    } else if (!items[i].isCancelled) {
                        const iTotal = items[i].totalPlaces || 1;
                        const iScanned = items[i].scannedPlaces !== undefined ? items[i].scannedPlaces : (items[i].status === 'scanned' ? iTotal : 0);

                        if (iScanned < iTotal) {
                            items[i].scannedPlaces = iScanned + 1;
                            items[i].scannedBy = currentUser.email;
                            items[i].scannedAt = new Date().toISOString();
                            
                            if (items[i].scannedPlaces === iTotal) {
                                items[i].status = 'scanned'; 
                            } else {
                                items[i].status = 'partial';
                            }
                            
                            foundItem = items[i];
                            await docRef.update({ items: items });
                            showSuccessFlash(foundItem, false);
                            return;
                        } else {
                            alreadyScanned = true;
                        }
                    }
                }
            }

            const errorMsg = alreadyScanned ? `Номер ${cleanCode} УЖЕ ОБРАБОТАН!` : `Номер ${cleanCode} ЧУЖОЙ!`;
            
            await docRef.update({
                errors: firebase.firestore.FieldValue.arrayUnion({
                    code: cleanCode,
                    message: alreadyScanned ? 'Повтор' : 'Лишний номер',
                    scannedBy: currentUser.email,
                    scannedAt: new Date().toISOString()
                })
            });

            showErrorOverlay(errorMsg);
        }

        function showSuccessFlash(item, isUndo) {
            playSuccessSound();
            const area = document.getElementById('scan-flash-area');
            
            area.className = `flex-1 p-4 md:p-6 flex flex-col items-center justify-center transition-colors border-b md:border-b-0 md:border-r overflow-y-auto ${isUndo ? 'flash-orange' : 'flash-green'}`;
            void area.offsetWidth; 
            area.classList.add(isUndo ? 'flash-orange' : 'flash-green');
            
            if (isUndo) {
                document.getElementById('scan-last-result').innerHTML = `
                    <div class="text-orange-600 font-bold text-2xl md:text-3xl">✔ ВОЗВРАТ: ${item.code}</div>
                    <div class="text-gray-800 font-bold text-xl mt-2 bg-orange-200 inline-block px-4 py-1 rounded shadow-sm">
                        Осталось вернуть: ${item.scannedPlaces} палет
                    </div>
                `;
            } else {
                const isDone = item.scannedPlaces === (item.totalPlaces || 1);
                const statusText = isDone ? 'ГОТОВО' : 'В ПРОЦЕССЕ';
                const isLoad = !currentManifestDoc.docType || currentManifestDoc.docType === 'load';
                const actionColor = isLoad ? 'text-green-600' : 'text-orange-600';
                
                document.getElementById('scan-last-result').innerHTML = `
                    <div class="${actionColor} font-bold text-2xl md:text-3xl">✔ ${item.code}</div>
                    <div class="text-gray-800 font-bold text-xl mt-2 bg-yellow-200 inline-block px-4 py-1 rounded shadow-sm">
                        ${item.scannedPlaces} из ${item.totalPlaces || 1} палет (${statusText})
                    </div>
                    <div class="text-gray-600 font-bold text-lg mt-2">Вес (B/N): ${item.brutto} / ${item.netto} кг</div>
                `;
            }
        }

        function showErrorOverlay(message) {
            playErrorSound();
            document.getElementById('error-message').innerText = message;
            document.getElementById('error-overlay').style.display = 'flex';
            document.getElementById('scanner-input').blur(); 
        }

        function closeErrorOverlay() {
            document.getElementById('error-overlay').style.display = 'none';
            document.getElementById('scanner-input').focus(); 
        }

        function generatePDF() {
            if (!currentManifestDoc) return;
            const data = currentManifestDoc;
            const isLoad = !data.docType || data.docType === 'load';
            const actionVerb = isLoad ? "ЗАГРУЗКИ" : "ВЫГРУЗКИ";
            const itemVerb = isLoad ? "Загружено" : "Выгружено";
            
            let totalPlaces = 0;
            let scannedPlaces = 0;
            let lastScanDt = null;

            data.items.forEach(i => {
                if (i.status === 'removed') return;
                
                totalPlaces += (i.totalPlaces || 1);
                scannedPlaces += (i.scannedPlaces !== undefined ? i.scannedPlaces : (i.status === 'scanned' ? (i.totalPlaces || 1) : 0));
                
                if (i.scannedAt && !i.isCancelled) {
                    let dt = new Date(i.scannedAt);
                    if (!lastScanDt || dt > lastScanDt) lastScanDt = dt;
                }
            });
            
            let createdDt = null;
            if (data.createdAt) {
                createdDt = typeof data.createdAt.toDate === 'function' ? data.createdAt.toDate() : new Date(data.createdAt);
            }
            let createdStr = createdDt ? createdDt.toLocaleString('ru-RU') : '-';
            let lastScanStr = lastScanDt ? lastScanDt.toLocaleString('ru-RU') : 'Нет сканирований';
            
            let durationStr = "-";
            if (createdDt && lastScanDt) {
                let diffSecs = Math.floor((lastScanDt - createdDt) / 1000);
                if (diffSecs >= 0) {
                    let h = Math.floor(diffSecs / 3600);
                    let m = Math.floor((diffSecs % 3600) / 60);
                    let s = diffSecs % 60;
                    let parts = [];
                    if (h > 0) parts.push(h + ' ч');
                    if (m > 0 || h > 0) parts.push(m + ' мин');
                    parts.push(s + ' сек');
                    durationStr = parts.join(' ');
                }
            }

            let html = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h1 style="font-size: 24px; font-family: sans-serif; margin-bottom: 5px;">АКТ ${actionVerb} Т/С</h1>
                    <p style="font-size: 18px; font-weight: bold; margin: 0;">Автомобиль: ${data.carNumber}</p>
                </div>
                
                <div style="display: flex; justify-content: space-between; font-family: sans-serif; font-size: 14px; margin-bottom: 20px; background: #f3f4f6; padding: 10px; border-radius: 5px;">
                    <div>
                        <p style="margin: 3px 0;"><strong>Создана (Офис):</strong> ${createdStr}</p>
                        <p style="margin: 3px 0;"><strong>Автор:</strong> ${data.creatorEmail}</p>
                        <p style="margin: 3px 0;"><strong>Последний скан:</strong> ${lastScanStr}</p>
                    </div>
                    <div style="text-align: right;">
                        <p style="margin: 3px 0; font-size: 16px;"><strong>Время обработки: <span style="color: #1d4ed8;">${durationStr}</span></strong></p>
                        <p style="margin: 3px 0; font-size: 16px;"><strong>Итог:</strong> ${itemVerb} ${scannedPlaces} из ${totalPlaces} мест</p>
                    </div>
                </div>
                
                <table class="print-table">
                    <thead><tr><th>№</th><th>Код</th><th>Места</th><th>Brutto</th><th>Netto</th><th>PCS</th><th>Статус</th><th>Время скана</th></tr></thead>
                    <tbody>
            `;

            let idx = 1;
            data.items.forEach((item) => {
                if (item.status === 'removed') return; 
                
                const iTotal = item.totalPlaces || 1;
                const iScanned = item.scannedPlaces !== undefined ? item.scannedPlaces : (item.status === 'scanned' ? iTotal : 0);
                
                let statusTxt = "";
                if (item.isCancelled) statusTxt = "⚠️ ОШИБКА (ВЕРНУТЬ)";
                else if (iScanned === iTotal) statusTxt = itemVerb.toUpperCase();
                else if (iScanned > 0) statusTxt = "ЧАСТИЧНО";
                else statusTxt = "ОЖИДАЕТ";
                
                let timeTxt = "-";
                if (item.scannedAt && !item.isCancelled) {
                    const dt = new Date(item.scannedAt);
                    timeTxt = dt.toLocaleDateString('ru-RU') + " " + dt.toLocaleTimeString('ru-RU', { hour12: false });
                }

                html += `<tr>
                    <td>${idx++}</td>
                    <td style="${item.isCancelled ? 'color:red; font-weight:bold;' : ''}">${item.code}</td>
                    <td>${iScanned} из ${iTotal}</td>
                    <td>${item.brutto}</td>
                    <td>${item.netto}</td>
                    <td>${item.pcs}</td>
                    <td style="${item.isCancelled ? 'color:red; font-weight:bold;' : ''}">${statusTxt}</td>
                    <td>${timeTxt}</td>
                </tr>`;
            });

            html += `</tbody></table>`;

            // ИСТОРИЯ РЕДАКТИРОВАНИЙ (ЛОГИ)
            if (data.editHistory && data.editHistory.length > 0) {
                html += `
                    <h3 style="margin-top:30px; font-family: sans-serif; font-size: 16px;">История изменений ведомости:</h3>
                    <table class="print-table" style="margin-top: 10px;">
                        <thead><tr><th>№</th><th>Дата и Время</th><th>Сотрудник (Офис)</th><th>Добавлены</th><th>Удалены</th><th>Изменено кол-во мест</th></tr></thead>
                        <tbody>
                `;
                data.editHistory.forEach((log, index) => {
                    let logTime = new Date(log.editedAt);
                    let formattedLogTime = logTime.toLocaleDateString('ru-RU') + " " + logTime.toLocaleTimeString('ru-RU', { hour12: false });
                    
                    let addedText = log.added && log.added.length > 0 ? log.added.join(', ') : '-';
                    let removedText = log.removed && log.removed.length > 0 ? log.removed.join(', ') : '-';
                    let changedText = log.changed && log.changed.length > 0 ? log.changed.join(', ') : '-';

                    html += `<tr>
                        <td>${index + 1}</td>
                        <td>${formattedLogTime}</td>
                        <td>${log.editedBy}</td>
                        <td style="color: green;">${addedText}</td>
                        <td style="color: red;">${removedText}</td>
                        <td style="color: blue;">${changedText}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            if (data.errors && data.errors.length > 0) {
                html += `
                    <h3 style="margin-top:30px; color: red; font-family: sans-serif; font-size: 16px;">Ошибочные сканирования (лишние номера):</h3>
                    <table class="print-table" style="margin-top: 10px;">
                        <thead><tr><th>№</th><th>Отсканированный код</th><th>Тип ошибки</th><th>Сотрудник</th><th>Время скана</th></tr></thead>
                        <tbody>
                `;
                data.errors.forEach((err, index) => {
                    let errTimeTxt = "-";
                    if (err.scannedAt) {
                        const dt = new Date(err.scannedAt);
                        errTimeTxt = dt.toLocaleDateString('ru-RU') + " " + dt.toLocaleTimeString('ru-RU', { hour12: false });
                    }
                    html += `<tr><td>${index + 1}</td><td>${err.code}</td><td>${err.message}</td><td>${err.scannedBy}</td><td>${errTimeTxt}</td></tr>`;
                });
                html += `</tbody></table>`;
            }

            html += `
                <div class="signature-block">
                    <div><p>Сдал (Склад): _______________________</p></div>
                    <div><p>Принял (Водитель): _______________________</p></div>
                </div>
            `;

            document.getElementById('print-area').innerHTML = html;
            document.getElementById('print-area').classList.remove('hidden');
            window.print();
        }

        window.onafterprint = function() { document.getElementById('print-area').classList.add('hidden'); };
    </script>
</body>
</html>
